<!DOCTYPE html>
<html lang="en">
  <head>
    <title>hello</title>
    <script>

      document.addEventListener('DOMContentLoaded', function() {
        document.querySelector('form').addEventListener('submit', function (event){ // lambda function, or anonymous function, porque só será usado uma vez
          alert('hello, ' + document.querySelector('#name').value);
          event.preventDefault();
        }); 
      });

    </script>
  </head>
  <body>
    <form>
      <input autocomplete="off" autofocus id="name" name="name" placeholder="Name" type="text">
      <input type="submit">
    </form>
  </body>
</html>
