<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<body>
    <form>
        <input autocomplete="off" autofocus name="email" pattern=".+@.+\.edu" placeholder="Email">
        <button>Register Email</button>
    </form>
    <form>
        <!---- US phone number pattern ---->
        <input autocomplete="off" autofocus name="phone" pattern="\d{3}-\d{3}-\d{4}" placeholder="Phone">
        <button>Register Phone Number</button>
    </form>
</body>
</html>
